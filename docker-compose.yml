services:
  wvplayer:
    image: wvplayer
    build: .
    env_file: .env
    volumes:
      - $WVPLAYER_ROOT_DIR:/usr/src/wvplayer-data
    ports:
      - '127.0.0.1:$WVPLAYER_PORT:3000'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 5
